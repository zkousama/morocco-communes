name = "communes"
compatibility_date = "2026-09-17"

# A Cloudflare Pages project: the site and the API tree are static files in dist/, served
# without running code, and functions/ answers the live routes. dist/_routes.json, written
# by the API build, says which paths those are.
pages_build_output_dir = "./dist"

# How the live routes and the MCP server are used, written by api/src/worker/usage.ts: the
# route or tool, the client's name for itself, the country. No addresses or query text.
# Free up to 100,000 data points a day, kept for 3 months. Static files aren't counted,
# since no code runs for them. Queried by `pnpm stats`.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "communes_usage"

# What the site was asked for, written by api/src/worker/demand.ts: the search, the place,
# the tool, the country. No addresses, no identifiers. Raw rows are deleted after 90 days
# by workers/rollup. Queried by `pnpm demand`.
[[d1_databases]]
binding = "DEMAND"
database_name = "communes_demand"
database_id = "b475d0f6-062f-462b-8f8f-685c438ab5ed"
migrations_dir = "migrations"
